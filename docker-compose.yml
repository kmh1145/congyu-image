services:
  congyu-image:
    image: ghcr.io/kmh1145/congyu-image:latest
    container_name: congyu-image
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # 对外访问地址；使用域名时改为 https://img.example.com
      BASE_URL: "http://localhost:8080"
      # 首次启动时创建的管理员账号，请务必修改默认密码
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-this-password"
      # 使用 HTTPS 域名时改为 "true"
      COOKIE_SECURE: "false"
      TZ: "Asia/Shanghai"
    volumes:
      - congyu-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  congyu-data:
    name: congyu-image-data
