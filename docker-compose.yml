services:
  congyu-data-init:
    image: alpine:3.21
    container_name: congyu-image-data-init
    user: "0:0"
    network_mode: none
    restart: "no"
    volumes:
      - ./data:/data
    command:
      - sh
      - -c
      - mkdir -p /data/images && chown -R 10001:10001 /data && chmod -R u+rwX /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER

  congyu-image:
    image: ghcr.io/kmh1145/congyu-image:latest
    container_name: congyu-image
    pull_policy: always
    restart: unless-stopped
    depends_on:
      congyu-data-init:
        condition: service_completed_successfully
    ports:
      - "10721:10721"
    environment:
      # 对外访问地址；使用域名时改为 https://img.example.com
      BASE_URL: "http://localhost:10721"
      # 首次启动时创建的管理员账号，请务必修改默认密码
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "change-this-password"
      # 使用 HTTPS 域名时改为 "true"
      COOKIE_SECURE: "false"
      TZ: "Asia/Shanghai"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
